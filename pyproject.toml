[project]
name = "audio-nodes"
version = "1.2.0"
description = "A nonoha-engine plugin for audio: device playback and file streaming, plus block-based synthesis (demand-driven clock, oscillators, noise, filters, panning, mixing, envelopes, polyphonic voices, reverb)."
readme = "README.md"
authors = [{name = "VIE Inc."}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["nonoha", "dataflow", "node-graph", "audio", "playback", "synthesis", "sounddevice", "portaudio"]
requires-python = ">=3.11"
dependencies = [
    # PortAudio is only used by the device nodes; mobile hosts play audio themselves.
    "sounddevice==0.5.5; sys_platform != 'android' and sys_platform != 'ios'",
    "numpy>=2.0",
    "scipy>=1.11",
    "soundfile",
]

[project.urls]
Homepage   = "https://github.com/viestyle-dev/audio-nodes"
Repository = "https://github.com/viestyle-dev/audio-nodes"
Issues     = "https://github.com/viestyle-dev/audio-nodes/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nonoha-core @ git+https://github.com/viestyle-dev/nonoha-core.git@v1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["audio_nodes"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.nonoha-hub]
engine-compatibility = [">=1.0.0", "<2.0.0"]
