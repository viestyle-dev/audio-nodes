[project]
name = "audio-nodes"
version = "0.3.0"
description = "A nonoha-engine plugin for audio playback and streaming, providing audio device control and file streaming capabilities within the nonoha-engine visual programming environment."
readme = "README.md"
authors = [{name = "VIE, Inc."}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["nonoha", "dataflow", "node-graph", "audio", "playback", "sounddevice", "portaudio"]
requires-python = ">=3.11"
dependencies = ["sounddevice==0.5.5", "numpy>=2.0", "soundfile"]

[project.urls]
Homepage   = "https://github.com/viestyle-dev/audio-nodes"
Repository = "https://github.com/viestyle-dev/audio-nodes"
Issues     = "https://github.com/viestyle-dev/audio-nodes/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nonoha-core @ git+https://github.com/viestyle-dev/nonoha-core.git",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["audio_nodes"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.nonoha-hub]
engine-compatibility = [">=0.9.0", "<0.11.0"]
